# Extracto de /etc/nginx/sites-available/default (solo los bloques modificados)
location / {
    auth_basic "Area restringida";
    auth_basic_user_file /etc/nginx/.htpasswd-lector;
    try_files $uri $uri/ =404;
}

location /admin/ {
    auth_basic "Solo administradores";
    auth_basic_user_file /etc/nginx/.htpasswd-admin;
    try_files $uri $uri/ =404;
}
